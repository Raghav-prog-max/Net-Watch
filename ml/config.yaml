# =============================================================================
# NetWatch – central configuration
#
# One key per setting, and every key here is read by the code named in its
# section. A setting that is not listed is not configurable here:
#   label map, training and LOFO families  -> ml/data/labels.py
#   LightGBM hyper-parameters, class weights -> ml/models/classifier.py
# =============================================================================

# ── Paths (ml/prepare.py, ml/train.py, replay/replayer.py, scripts/*) ─────────
paths:
  raw_dir:     data/raw
  processed:   data/processed/flows.pkl
  model_dir:   models/v1
  reports_dir: reports

# ── Kaggle dataset (scripts/download_data.py) ─────────────────────────────────
kaggle:
  dataset: "cicdataset/cicids2017"      # <owner>/<dataset-slug> on Kaggle
  expected_files:                        # presence check before download
    - "Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv"
    - "Monday-WorkingHours.pcap_ISCX.csv"
    - "Tuesday-WorkingHours.pcap_ISCX.csv"
    - "Wednesday-workingHours.pcap_ISCX.csv"
    - "Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv"
    - "Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv"
    - "Friday-WorkingHours-Morning.pcap_ISCX.csv"
    - "Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv"

# ── Splits (ml/data/split.py via ml/train.py) ─────────────────────────────────
split:
  test_size:     0.30   # held out, then halved into validation and test (15% each)
  block_minutes: 5      # time-block size; no block appears in two splits
  random_state:  42     # the project's one seed (splits, models, NSL-KDD check)

# ── Training (ml/train.py, ml/evaluate/lofo.py, ml/evaluate/naive.py) ─────────
train:
  classifier: auto        # auto | lightgbm | rf
  benign_downsample: 0.20 # keep this fraction of benign rows in TRAIN only
  fpr_budget: 0.005       # false alerts of the WHOLE system (classifier or detector):
                          # at most 50 per 10,000 benign flows
  # The classifier's share of that budget; the detector's share is anomaly.benign_flag_rate.
  # Chosen from the trade-off table in the model card (team decision, 30 Sep 2026):
  # 0.4% + 0.1% stays within 0.5% and keeps the detector catching unseen families.
  classifier_fpr_budget: 0.004

# Reported as the chosen strategy next to the imbalance study (ml/train.py). The
# class weights themselves are set in ml/models/classifier.py.
imbalance_strategy: class_weight

# ── Random Forest baseline (ml/train.py) ──────────────────────────────────────
classifier:
  random_forest:
    n_estimators: 300

# ── Anomaly detector and label check (ml/train.py, ml/evaluate/lofo.py) ───────
anomaly:
  n_estimators: 200
  max_samples: 50000
  benign_flag_rate: 0.001   # flags 0.1% of benign validation traffic (its budget share)
  family_keep_rate: 0.99    # out-of-family check keeps 99% of each family's own flows

# ── Drift monitoring (api/services/scorer.py, ml/train.py, ml/evaluate/model_card.py) ──
drift:
  window: 5000              # recent benign-looking flows the PSI is computed over
  bins: 10                  # quantile bins from benign validation traffic
  warn_psi: 0.10            # Warning: any feature above
  drift_psi: 0.25           # Drift: three or more features above
  alert_rate_warning_multiplier: 1.5   # Unknown-alert rate vs its training baseline
  alert_rate_drift_multiplier:   2.0   # (alone it can only raise Warning)
  top_features_ks: 15       # KS test on the classifier's most important features
  history_every: 1000       # flows between drift snapshots kept for /metrics/drift
  history_keep: 100         # snapshots kept
  fp_share_alerts: 500      # most recent alerts the false-positive share is measured on
