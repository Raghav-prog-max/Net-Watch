# ==============================================================================
# NetWatch AI SOC — Routes, shared by site-http.conf and site-https.conf
# ==============================================================================
# The API lives under /api. Its routes (/alerts, /models, /metrics/...) share
# names with dashboard pages, and routing them by name sent /alerts, /alerts/<id>
# and /models to the API, so those pages could not be opened. The prefix is
# stripped on the way in: /api/alerts -> api:8000/alerts. The dashboard is built
# with NEXT_PUBLIC_API_URL=<scheme>://<host>/api to match.
# ==============================================================================

# ── WebSocket alert stream: /api/ws/alerts -> api:8000/ws/alerts ─────────────
location /api/ws/ {
    proxy_pass http://api_backend/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ── Flow scoring, rate-limited on its own ────────────────────────────────────
location = /api/score {
    limit_req zone=score_limit burst=30 nodelay;
    proxy_pass http://api_backend/score;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# ── Prometheus metrics stay off the public site ──────────────────────────────
# Prometheus scrapes api:8000/metrics on the private network
# (deployment/monitoring/prometheus.yml); nothing outside needs it.
location = /api/metrics {
    return 404;
}

# ── The rest of the API ───────────────────────────────────────────────────────
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# ── Next.js static assets, cached for a year ─────────────────────────────────
location /_next/static/ {
    proxy_pass http://dashboard_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # an add_header here drops the server's, so the security headers come again
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# ── Dashboard and landing page: every other path ─────────────────────────────
location / {
    proxy_pass http://dashboard_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
