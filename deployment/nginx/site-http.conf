# ==============================================================================
# NetWatch AI SOC — Plain HTTP site (the default; local and staging)
# ==============================================================================
# For production, use site-https.conf (NGINX_SITE=https in .env.production).
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    include /etc/nginx/security-headers.conf;
    include /etc/nginx/netwatch-locations.conf;
}
