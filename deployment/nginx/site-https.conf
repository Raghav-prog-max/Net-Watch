# ==============================================================================
# NetWatch AI SOC — HTTPS site: HTTP redirects, TLS 1.2+ only, HSTS
# ==============================================================================
# Needs deployment/nginx/ssl/fullchain.pem and privkey.pem, mounted at
# /etc/nginx/ssl (scripts/init-ssl.sh writes them). nginx does not start without
# them. Select with NGINX_SITE=https in .env.production.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/security-headers.conf;
    # browsers honour HSTS over HTTPS only, so it is set here and not in
    # security-headers.conf, which the plain HTTP site uses too
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/netwatch-locations.conf;
}
