# ==============================================================================
# NetWatch AI SOC — Production Nginx Configuration
# ==============================================================================
# Reverse proxy, optional TLS termination (site-https.conf), WebSockets, rate limiting.
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging Format ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance Optimizations ─────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25M;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── WebSocket Upgrade Mapping ─────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # Limit scoring throughput per IP to 100 requests per second
    limit_req_zone $binary_remote_addr zone=score_limit:10m rate=100r/s;
    # Limit general API requests to 50 requests per second
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # ── Upstream Service Definitions ──────────────────────────────────────────
    upstream api_backend {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream dashboard_frontend {
        server dashboard:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── The site: plain HTTP, or HTTPS with a redirect ────────────────────────
    # docker-compose.prod.yml mounts site-http.conf (the default) or
    # site-https.conf here, chosen by NGINX_SITE. Both serve the routes in
    # netwatch-locations.conf.
    include /etc/nginx/netwatch-site.conf;
}
