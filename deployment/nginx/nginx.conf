# ==============================================================================
# NetWatch AI SOC — Production Nginx Configuration
# ==============================================================================
# Reverse proxy, SSL termination, WebSocket multiplexing, rate limiting, and caching.
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging Format ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance Optimizations ─────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25M;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── WebSocket Upgrade Mapping ─────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # Limit scoring throughput per IP to 100 requests per second
    limit_req_zone $binary_remote_addr zone=score_limit:10m rate=100r/s;
    # Limit general API requests to 50 requests per second
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # ── Upstream Service Definitions ──────────────────────────────────────────
    upstream api_backend {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream dashboard_frontend {
        server dashboard:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── HTTP Server (Redirect to HTTPS or Plain Port 80) ──────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge for Let's Encrypt certificates
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Include security headers
        include /etc/nginx/security-headers.conf;

        # ── Next.js Static Cache Optimization ─────────────────────────────────
        location /_next/static/ {
            proxy_pass http://dashboard_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── WebSocket Alert Stream ───────────────────────────────────────────
        location /ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── ML Flow Scoring Endpoint ─────────────────────────────────────────
        location /score {
            limit_req zone=score_limit burst=30 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ── API Routes (Alerts, Metrics, Models) ──────────────────────────────
        location ~ ^/(alerts|metrics|models|evaluation) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ── Dashboard & Landing Page ─────────────────────────────────────────
        location / {
            proxy_pass http://dashboard_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
