# ==============================================================================
# NetWatch AI SOC — Nginx Security Headers Configuration
# ==============================================================================

# Protect against clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS filtering in browsers
add_header X-XSS-Protection "1; mode=block" always;

# Control referrer information sent with requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser features & APIs
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# HSTS is set by site-https.conf only: browsers ignore it over plain HTTP.

# Content Security Policy (allows Spline 3D WebGL assets, WebSockets, and inline fonts)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://prod.spline.design https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*; font-src 'self' data:; connect-src 'self' http: https: ws: wss: https://prod.spline.design https://*.spline.design; worker-src 'self' blob:; frame-ancestors 'self';" always;
