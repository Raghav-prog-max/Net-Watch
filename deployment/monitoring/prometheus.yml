# ==============================================================================
# NetWatch AI SOC — Prometheus scrape configuration
# ==============================================================================
# The API's GET /metrics (api/services/telemetry.py), on the private network.
# Nginx is not scraped: it exposes no Prometheus metrics without a stub_status
# endpoint and an exporter, and scraping nginx:80 only fetched the landing page.
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'netwatch-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
