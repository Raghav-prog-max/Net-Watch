# ==============================================================================
# NetWatch AI SOC — Prometheus Scrape Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # NetWatch FastAPI Metrics
  - job_name: 'netwatch-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          environment: 'production'

  # Nginx Reverse Proxy (if using nginx-prometheus-exporter)
  - job_name: 'netwatch-nginx'
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'nginx'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
