# Loads every dashboard JSON in /var/lib/grafana/dashboards
# (deployment/monitoring/grafana/dashboards) into the NetWatch folder.
apiVersion: 1
providers:
  - name: netwatch
    folder: NetWatch
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
