apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netwatch-api-hpa
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netwatch-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netwatch-dashboard-hpa
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch-dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netwatch-dashboard
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
