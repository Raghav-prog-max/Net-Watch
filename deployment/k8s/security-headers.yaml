# The security headers nginx sends in the Compose deployment
# (deployment/nginx/security-headers.conf), for ingress-nginx to add to every
# response. ingress-nginx reads them from its own ConfigMap's add-headers key,
# which applies to every site on the controller:
#   kubectl -n ingress-nginx patch configmap ingress-nginx-controller --type merge \
#     -p '{"data":{"add-headers":"netwatch/netwatch-security-headers"}}'
apiVersion: v1
kind: ConfigMap
metadata:
  name: netwatch-security-headers
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch
data:
  X-Frame-Options: "SAMEORIGIN"
  X-Content-Type-Options: "nosniff"
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
  Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://prod.spline.design https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*; font-src 'self' data:; connect-src 'self' http: https: ws: wss: https://prod.spline.design https://*.spline.design; worker-src 'self' blob:; frame-ancestors 'self';"
