apiVersion: apps/v1
kind: Deployment
metadata:
  name: netwatch-api
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch-api
    app.kubernetes.io/part-of: netwatch-soc
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: netwatch-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netwatch-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/satveek-gupta/netwatch-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http-api
              protocol: TCP
          envFrom:
            - configMapRef:
                name: netwatch-config
            - secretRef:
                name: netwatch-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: 2000m
              memory: 3072Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: data-volume
              mountPath: /data/db
            - name: models-volume
              mountPath: /app/models
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: netwatch-data-pvc
        - name: models-volume
          persistentVolumeClaim:
            claimName: netwatch-models-pvc
