apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netwatch-ingress
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
spec:
  tls:
    - hosts:
        - netwatch.yourdomain.com
      secretName: netwatch-tls-cert
  rules:
    - host: netwatch.yourdomain.com
      http:
        paths:
          # WebSocket streaming
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: netwatch-api-service
                port:
                  number: 8000
          # API endpoints
          - path: /score
            pathType: Prefix
            backend:
              service:
                name: netwatch-api-service
                port:
                  number: 8000
          - path: /alerts
            pathType: Prefix
            backend:
              service:
                name: netwatch-api-service
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: netwatch-api-service
                port:
                  number: 8000
          - path: /models
            pathType: Prefix
            backend:
              service:
                name: netwatch-api-service
                port:
                  number: 8000
          - path: /evaluation
            pathType: Prefix
            backend:
              service:
                name: netwatch-api-service
                port:
                  number: 8000
          # Next.js Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netwatch-dashboard-service
                port:
                  number: 3000
