# ==============================================================================
# NetWatch AI SOC — Kubernetes Secrets Template
# ==============================================================================
# DO NOT COMMIT plain secrets. Base64 encode values before applying:
# echo -n 'your_secret_value' | base64
#
# The API reads NETWATCH_API_KEY (POST /score and PATCH /alerts need it in the
# X-API-Key header; api/services/auth.py); nothing reads the other two yet. The
# API deployment marks the Secret optional: without it those endpoints accept
# any caller. Replace every value before applying it: as they stand they are
# the same everywhere.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: netwatch-secrets
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch
type: Opaque
data:
  # Base64 encoded key for the API's write endpoints (openssl rand -hex 32)
  NETWATCH_API_KEY: Y2hhbmdlLXRoaXMtYXBpLWtleQ==
  # Base64 encoded secret key for signing tokens / sessions
  SECRET_KEY: Y2hhbmdlLXRoaXMtdG8tYS1zZWN1cmUtcmFuZG9tLTY0LWNoYXJhY3Rlci1oZXgta2V5
  # Base64 encoded Grafana admin password
  GRAFANA_ADMIN_PASSWORD: YWRtaW5fbmV0d2F0Y2hfc2VjdXJl
