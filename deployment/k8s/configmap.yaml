apiVersion: v1
kind: ConfigMap
metadata:
  name: netwatch-config
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  WEB_CONCURRENCY: "4"
  ALERT_BUDGET_PER_10K: "50"
  DRIFT_CHECK_INTERVAL_MINUTES: "60"
  NETWATCH_DB: "/data/db/netwatch.db"
  ALLOWED_ORIGINS: "https://netwatch.yourdomain.com"
  NEXT_PUBLIC_API_URL: "https://api.netwatch.yourdomain.com"
  NEXT_PUBLIC_WS_URL: "wss://api.netwatch.yourdomain.com/ws/alerts"
