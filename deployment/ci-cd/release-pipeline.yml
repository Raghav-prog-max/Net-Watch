# ==============================================================================
# NetWatch AI SOC — Production Release & Container Publishing Pipeline
# ==============================================================================
# Builds multi-arch container images, runs security scans, and pushes to GHCR.
# ==============================================================================

name: Production Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository }}/dashboard

jobs:
  # ── QUALITY & TEST VERIFICATION GATE ─────────────────────────────────────────
  audit:
    name: Lint, Test & Model Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd dashboard && npm ci

      - name: Run Backend Unit Tests
        run: pytest tests/ -v

      - name: Run Frontend TypeCheck & Build
        run: |
          cd dashboard
          npm run typecheck
          npm run build

  # ── CONTAINER BUILD & PUBLISH ───────────────────────────────────────────────
  publish:
    name: Build & Push Production Images
    needs: [audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.API_IMAGE }}
            ${{ env.DASHBOARD_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:latest,${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dashboard container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          # Next.js fixes the API address and key at build time; the site's URL
          # is a repository variable (e.g. https://netwatch.yourdomain.com), the
          # key a repository secret matching the API's NETWATCH_API_KEY
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_URL }}/api
            NEXT_PUBLIC_NETWATCH_API_KEY=${{ secrets.NETWATCH_API_KEY }}
          push: true
          tags: ${{ env.DASHBOARD_IMAGE }}:latest,${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── PRODUCTION DEPLOYMENT ROLLOUT ───────────────────────────────────────────
  deploy:
    name: Kubernetes Zero-Downtime Rollout
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.event.inputs.target_env == 'production' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubectl Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Rollout New Images to Kubernetes
        run: |
          kubectl set image deployment/netwatch-api api=${{ env.API_IMAGE }}:${{ github.sha }} -n netwatch
          kubectl set image deployment/netwatch-dashboard dashboard=${{ env.DASHBOARD_IMAGE }}:${{ github.sha }} -n netwatch
          kubectl rollout status deployment/netwatch-api -n netwatch --timeout=120s
          kubectl rollout status deployment/netwatch-dashboard -n netwatch --timeout=120s
