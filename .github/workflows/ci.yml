# Runs on every pull request and on main. It rebuilds everything from a clean
# checkout, the way the handbook's Definition of Done asks: the ML pipeline end
# to end on synthetic data, the full test suite, the dashboard lint and build, and the
# API's Docker image.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret & API Key Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run hardcoded API key detection test
        run: python -m pytest tests/test_api_keys.py -v

  pipeline:
    name: ML pipeline + tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Dockerfile and the handbook
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Synthetic data: the real CICIDS2017 files are not in the repository.
      # This checks the pipeline runs end to end, not the reported numbers.
      - name: Generate data
        run: |
          make synthetic
          make data

      - name: Train (LOFO, naive split and imbalance study included)
        run: make train

      - name: Evaluation report and model card
        run: make evaluate

      # With trained models present, the tests that need them run instead of skipping.
      - name: Tests
        run: make test

  dashboard:
    name: Dashboard lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"       # same as docker-compose; Next 16 needs >= 20.9
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t netwatch-api -f deployment/docker/Dockerfile.api .

      # The image once built fine and then died at import (LightGBM needs libgomp1).
      - name: Import check
        run: docker run --rm netwatch-api python -c "import lightgbm, api.main; print('api imports')"
